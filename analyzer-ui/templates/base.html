<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Analyzer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/analyzer.css') }}">
  <script src="{{ url_for('static', filename='js/analyzer.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="index.html">Analyzer</a>
      <p class="step-label">{% block step_label %}Start{% endblock %}</p>
    </div>
  </header>
  {% block progress %}{% endblock %}
  <main id="content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="actions-bar">
    <div class="actions">
      {% block actions %}{% endblock %}
    </div>
  </footer>
</body>
</html>
