<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Analyzer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/web2.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to conversation</a>
  <header class="topbar">
    <div class="column">
      <h1 class="brand"><a href="index.html">Analyzer</a></h1>
      <p class="quiet">This chat collects code only.</p>
      <nav aria-label="Views">
        <a href="index.html">Chat</a>
        <a href="mentor.html">Mentor view</a>
      </nav>
    </div>
  </header>
  <div class="shell">
    <div class="conversation">
      <main id="main" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
      {% block composer %}{% endblock %}
    </div>
    <aside class="side">
      {% block aside %}{% endblock %}
    </aside>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
